# Configuration for the territory design pipeline
# Zagreb West distribution area, October 2025, 20 couriers

data:
  input_file: "data/input.csv"  # Update this path to your preprocessed data file
  results_dir: "results"

# Capacity range - as used in the paper (Section 3.1)
# Fixed [60,80] as normative operational target, not calibrated to actual sample volume.
# Actual median is ~61/day per courier, but some days have extreme total
# volume (218 to 1423 parcels/day for 20 couriers) where [60,80] is not always feasible -
# documented as infeasibility diagnostics in results, not resolved by changing the target.
capacity:
  n_min: 60
  n_max: 80

# Hexagonal geometry (Section 3.2)
hexagon:
  base_lattice_km: 1.0       # base lattice for snap-cover-cap (Stage 3)
  refine_lattice_km: 0.5     # fine lattice for local optimization (Stage 5)
  s_base_m: 1000.0           # base side length for floor calculation
  s_max_m: 2000.0            # strict upper bound on hexagon side length
  s_floor_frac: 0.75         # floor = 0.75 * s_base

# Stage 5 - Overlap and Density Refinement scoring function
# Score_u = sum_v!=u Area(Hu n Hv) + alpha * outside_u + lambda_dens*(Au/Nu) + lambda_eq*(Au/Nu - delta)^2
refinement:
  alpha: 1000000.0            # large penalty for parcels outside their assigned hexagon
  lambda_dens: 1.0           # weight for density minimization term (A/N)
  lambda_eq: 0.001           # weight for cross-courier equity term
  max_iterations: 10         # number of greedy descent iterations per day

# Min-Cost Flow (Method 2)
mcf:
  distance_penalty_km: 4.0    # distance threshold for quadratic penalty (tuned variant)
  penalty_weight: 50.0        # quadratic penalty coefficient

# Weighted Voronoi / Power Diagram (Method 3)
weighted_voronoi:
  learning_rate_baseline: 1.0
  learning_rate_tuned: 0.1     # tuned variant: 0.1x baseline learning rate
  l2_regularization: 0.01      # tuned variant: weight regularization
  max_iterations: 50
  convergence_tol: 0.5         # convergence if capacity deviation changes less than this

# Study region
region:
  center_lat: 45.8150
  center_lon: 15.9819
  radius_km: 10.0
